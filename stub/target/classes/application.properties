# Porta do servidor
server.port=8080

# Atraso do stub em milissegundos (configurável sem recompilar)
stub.delay-ms=1000

# Ativa Virtual Threads no servidor embutido Tomcat do Stub.
# Permite ao Stub responder a milhares de pedidos concorrentes de 1 segundo
# sem esgotar o pool de 200 threads, evitando que o Stub seja o gargalo do teste.
spring.threads.virtual.enabled=true
