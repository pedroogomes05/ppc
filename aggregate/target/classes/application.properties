# Porta do agregador (diferente do stub que corre na 8080)
server.port=8081

# URL do stub — muda aqui se o stub correr noutra porta ou máquina
stub.url=http://localhost:8080/stub

# --- Configuração do ensaio (fixada explicitamente para reprodutibilidade) ---
# Nº máximo de threads do Tomcat (valor por omissão do Spring Boot, agora explícito).
server.tomcat.threads.max=200
# Sem logs por pedido durante os benchmarks (erros continuam a aparecer).
logging.level.pt.fcul.ppc=WARN
